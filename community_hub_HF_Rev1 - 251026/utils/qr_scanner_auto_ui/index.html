<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QR Scanner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: transparent;
    color: #1a1a1a;
    padding: 6px;
  }
  #status {
    text-align: center;
    padding: 12px;
    border-radius: 8px;
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  #status.scanning { background: #e3f2fd; color: #0d47a1; }
  #status.success  { background: #d4edda; color: #155724; }
  #status.error    { background: #f8d7da; color: #721c24; }
  #status.waiting  { background: #fff3cd; color: #856404; }

  #camera-container {
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
    min-height: 260px;
    position: relative;
  }
  #camera-container video {
    width: 100% !important;
    height: auto !important;
    border-radius: 12px;
    display: block;
  }

  #usb-input {
    position: absolute;
    left: -9999px;
    opacity: 0;
    width: 1px;
    height: 1px;
  }

  #usb-hint {
    text-align: center;
    font-size: 13px;
    color: #666;
    margin-top: 10px;
    line-height: 1.6;
  }

  #flash {
    position: fixed; inset: 0;
    background: #28a745; opacity: 0;
    pointer-events: none; transition: opacity 0.15s;
    z-index: 9999;
  }
  #flash.active { opacity: 0.5; }

  #boot-log {
    font-size: 11px;
    color: #999;
    text-align: center;
    margin-top: 6px;
    font-family: monospace;
  }
</style>
</head>
<body>
  <div id="flash"></div>
  <div id="status" class="waiting">⏳ Loading scanner…</div>
  <div id="camera-container"></div>
  <input id="usb-input" type="text" autocomplete="off" autocorrect="off"
         autocapitalize="off" spellcheck="false" />
  <div id="usb-hint">
    📷 Point QR code at camera &nbsp;|&nbsp; 🔫 Or use USB scanner
  </div>
  <div id="boot-log"></div>

<script type="module">
  const statusEl = document.getElementById('status');
  const flashEl  = document.getElementById('flash');
  const usbInput = document.getElementById('usb-input');
  const bootLog  = document.getElementById('boot-log');

  function log(msg) {
    console.log('[QR]', msg);
    bootLog.textContent = msg;
  }

  let lastFired = '';
  let lastFiredAt = 0;
  const DUP_WINDOW_MS = 3000;
  let Streamlit = null;

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || 'scanning';
  }

  function fireQr(raw) {
    const now = Date.now();
    const value = String(raw || '').trim();
    if (!value) return;
    if (value === lastFired && (now - lastFiredAt) < DUP_WINDOW_MS) return;
    lastFired = value;
    lastFiredAt = now;

    setStatus('✅ Scanned — processing…', 'success');
    flashEl.classList.add('active');
    setTimeout(() => flashEl.classList.remove('active'), 300);

    if (Streamlit && Streamlit.setComponentValue) {
      try {
        Streamlit.setComponentValue({ value: value, ts: now });
      } catch (e) {
        log('setComponentValue failed: ' + e.message);
      }
    } else {
      log('Streamlit not available — value lost: ' + value);
    }

    setTimeout(() => setStatus('🟢 Scanning…', 'scanning'), 1800);
  }

  // ── USB scanner capture ──
  let usbBuffer = '';
  let usbTimer = null;

  usbInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const v = (usbBuffer || usbInput.value).trim();
      usbBuffer = '';
      usbInput.value = '';
      if (v) fireQr(v);
      return;
    }
    if (e.key.length === 1) {
      usbBuffer += e.key;
      clearTimeout(usbTimer);
      usbTimer = setTimeout(() => {
        const v = usbBuffer.trim();
        usbBuffer = '';
        usbInput.value = '';
        if (v && v.length > 5) fireQr(v);
      }, 120);
    }
  });

  setInterval(() => {
    if (document.activeElement !== usbInput) {
      try { usbInput.focus(); } catch (e) {}
    }
  }, 800);

  // ── Load Streamlit component-lib via ES module ──
  async function loadStreamlit() {
    try {
      const mod = await import('https://cdn.jsdelivr.net/npm/streamlit-component-lib@2.0.0/+esm');
      Streamlit = mod.Streamlit;
      Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, () => {
        try { Streamlit.setFrameHeight(560); } catch (e) {}
      });
      Streamlit.setComponentReady();
      Streamlit.setFrameHeight(560);
      log('✅ Streamlit lib loaded');
      return true;
    } catch (e) {
      log('❌ Streamlit lib failed: ' + e.message);
      setStatus('⚠️ Component library failed to load', 'error');
      return false;
    }
  }

  // ── Load html5-qrcode via ES module ──
  async function loadQrLib() {
    try {
      const mod = await import('https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/+esm');
      log('✅ html5-qrcode loaded');
      return mod.Html5Qrcode;
    } catch (e) {
      log('❌ html5-qrcode failed: ' + e.message);
      return null;
    }
  }

  // ── Start camera ──
  async function startCamera(Html5Qrcode) {
    if (!Html5Qrcode) {
      setStatus('⚠️ Camera library unavailable — USB only', 'waiting');
      return;
    }
    try {
      const scanner = new Html5Qrcode("camera-container");
      const config = { fps: 10, qrbox: { width: 250, height: 250 } };
      await scanner.start(
        { facingMode: "environment" },
        config,
        (decodedText) => fireQr(decodedText),
        () => {}
      );
      setStatus('🟢 Scanning…', 'scanning');
      log('✅ Camera active');
    } catch (err) {
      console.warn('Camera unavailable:', err);
      setStatus('⚠️ Camera unavailable — USB only', 'waiting');
      log('Camera error: ' + err.message);
    }
  }

  // ── Boot ──
  (async () => {
    setStatus('⏳ Loading libraries…', 'waiting');
    await loadStreamlit();
    const Html5Qrcode = await loadQrLib();
    setStatus('⏳ Starting camera…', 'waiting');
    await startCamera(Html5Qrcode);
  })();
</script>
</body>
</html>
