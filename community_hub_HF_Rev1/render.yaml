services:
  - type: web
    name: woodlands-community-hub
    env: python
    plan: free
    buildCommand: |
      cd community_hub_HF_Rev1
      pip install -r requirements.txt
    startCommand: |
      cd community_hub_HF_Rev1
      streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CHECKER_PASSWORD
        sync: false
      - key: CHAIRMAN_PASSWORD
        sync: false
      - key: APP_URL
        sync: false