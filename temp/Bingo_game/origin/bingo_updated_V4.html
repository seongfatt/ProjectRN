<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Bingo Game - Woodlands Zone 6 Residents' Network</title>
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #5568d3;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --text-dark: #1f2937;
            --text-light: #6b7280;
            --card-bg: #ffffff;
            --border-radius: 1rem;
            --focus-ring: 0 0 0 4px rgba(102, 126, 234, 0.5);
            --transition: all 0.2s ease;
            --base-font: clamp(0.875rem, 2.5vw, 1.25rem);
            --ball-size: clamp(3rem, 12vw, 8rem);
            --cell-size: clamp(2.5rem, 5vw, 4rem);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: 'Arial', 'Noto Sans', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1vh 1vw;
            font-size: var(--base-font);
            overflow-x: hidden;
        }

        .container {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: clamp(1rem, 3vw, 2rem);
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
            width: min(98vw, 1400px);
            height: min(98vh, 800px);
            display: flex;
            flex-direction: column;
            gap: clamp(0.75rem, 2vw, 1.5rem);
        }

        h1 {
            text-align: center;
            color: var(--primary);
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            padding: 0.5rem 0;
        }

        .game-area {
            display: grid;
            grid-template-columns: minmax(250px, 1fr) 2.5fr;
            gap: clamp(0.75rem, 2vw, 1.5rem);
            flex: 1;
            min-height: 0;
        }

        @media (max-width: 900px) {
            .game-area {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
            }
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            gap: clamp(0.75rem, 2vw, 1.5rem);
        }

        .call-display {
            background: var(--bg-gradient);
            border-radius: var(--border-radius);
            padding: clamp(1rem, 3vw, 1.5rem);
            text-align: center;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: clamp(150px, 30vh, 250px);
        }

        .call-text {
            font-size: clamp(0.875rem, 2vw, 1.25rem);
            opacity: 0.95;
            margin-bottom: 0.5rem;
        }

        .current-ball {
            font-size: var(--ball-size);
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            transition: transform 0.2s ease;
            line-height: 1;
        }

        .current-ball.animating {
            animation: pulse 0.3s ease;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .rolling-numbers {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
        }

        .rolling-numbers.active {
            opacity: 1;
        }

        .rolling-number {
            font-size: clamp(2rem, 8vw, 5rem);
            font-weight: bold;
            animation: roll 0.12s ease-out;
        }

        @keyframes roll {
            0% { transform: translateY(-30%) scale(0.8); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(30%) scale(1.2); opacity: 0; }
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr;
            gap: clamp(0.5rem, 1.5vw, 1rem);
        }

        button {
            padding: clamp(0.75rem, 2vw, 1.25rem);
            font-size: clamp(0.875rem, 2.5vw, 1.125rem);
            font-weight: 600;
            border: none;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: var(--primary);
            color: white;
            position: relative;
            outline: none;
        }

        button:focus-visible {
            box-shadow: var(--focus-ring);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #d1d5db;
            cursor: not-allowed;
            transform: none;
            opacity: 0.7;
        }

        .btn-fullscreen { background: #8b5cf6; }
        .btn-fullscreen:hover:not(:disabled) { background: #7c3aed; }
        
        .btn-call { background: var(--success); }
        .btn-call:hover:not(:disabled) { background: #059669; }
        
        .btn-reset { background: var(--danger); }
        .btn-reset:hover:not(:disabled) { background: #dc2626; }
        
        .btn-auto { background: var(--info); }
        .btn-auto:hover:not(:disabled) { background: #2563eb; }

        .board {
            background: #f3f4f6;
            border-radius: var(--border-radius);
            padding: clamp(0.75rem, 2vw, 1.5rem);
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: clamp(0.25rem, 0.8vw, 0.5rem);
            flex: 1;
            overflow-y: auto;
            padding-right: 0.25rem;
        }

        .number-cell {
            background: white;
            border: 2px solid #d1d5db;
            border-radius: 0.5rem;
            padding: clamp(0.5rem, 1.5vw, 0.75rem);
            text-align: center;
            font-size: clamp(0.875rem, 2.5vw, 1.25rem);
            font-weight: 600;
            color: var(--text-dark);
            transition: var(--transition);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: var(--cell-size);
            outline: none;
            position: relative;
        }

        .number-cell:focus-visible {
            box-shadow: var(--focus-ring);
            border-color: var(--primary);
            z-index: 2;
        }

        .number-cell:hover:not(.called) {
            transform: scale(1.03);
            border-color: var(--primary);
        }

        .number-cell.called {
            background: var(--success);
            color: white;
            border-color: #059669;
            font-weight: 700;
        }

        .number-cell.called:focus-visible {
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.6);
        }

        .stats {
            display: flex;
            justify-content: space-around;
            padding: clamp(0.75rem, 2vw, 1rem);
            background: #f9fafb;
            border-radius: 0.75rem;
            gap: 1rem;
        }

        .stat-item {
            text-align: center;
            min-width: 80px;
        }

        .stat-value {
            font-size: clamp(1.5rem, 4vw, 2.25rem);
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            color: var(--text-light);
            margin-top: 0.25rem;
            font-size: clamp(0.75rem, 2vw, 0.9rem);
        }

        .history {
            padding: clamp(0.75rem, 2vw, 1rem);
            background: #f9fafb;
            border-radius: 0.75rem;
            max-height: clamp(60px, 12vh, 100px);
            overflow-y: auto;
        }

        .history-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
            font-size: clamp(0.875rem, 2vw, 1rem);
        }

        .history-numbers {
            display: flex;
            flex-wrap: wrap;
            gap: clamp(0.25rem, 0.8vw, 0.5rem);
        }

        .history-number {
            background: var(--primary);
            color: white;
            padding: clamp(0.25rem, 0.8vw, 0.4rem) clamp(0.5rem, 1.5vw, 0.75rem);
            border-radius: 0.375rem;
            font-weight: 600;
            font-size: clamp(0.75rem, 2vw, 0.9rem);
            white-space: nowrap;
        }

        /* TV-Specific Enhancements */
        @media (display-mode: tv) {
            body {
                padding: 2vh 2vw;
            }
            button {
                min-height: clamp(3rem, 8vh, 4rem);
                font-size: clamp(1rem, 3vw, 1.375rem);
            }
            .number-cell {
                min-height: clamp(3rem, 6vw, 4.5rem);
                font-size: clamp(1rem, 3vw, 1.5rem);
            }
        }

        /* Reduced motion preference */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Scrollbar styling for TV browsers */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎱 BINGO GAME - Woodlands Zone 6 Residents' Network 🎱</h1>
        
        <div class="game-area">
            <div class="left-panel">
                <div class="call-display" aria-live="polite">
                    <div class="rolling-numbers" id="rollingNumbers" aria-hidden="true"></div>
                    <div class="call-text">Current Call</div>
                    <div class="current-ball" id="currentBall" aria-label="Current bingo number">-</div>
                    <div class="call-text" id="callLetter">Ready to Start</div>
                </div>
                
                <div class="controls" role="group" aria-label="Game controls">
                    <button class="btn-fullscreen" id="fullscreenBtn" onclick="toggleFullscreen()" 
                            aria-label="Toggle fullscreen mode">Enter Fullscreen</button>
                    <button class="btn-call" id="callBtn" onclick="callNumber()" 
                            aria-label="Call next random bingo number">Call Number</button>
                    <button class="btn-auto" id="autoBtn" onclick="toggleAuto()" 
                            aria-label="Toggle auto-call mode">Start Auto-Call</button>
                    <button class="btn-reset" onclick="resetGame()" 
                            aria-label="Reset the bingo game">Reset Game</button>
                </div>

                <div class="stats" aria-label="Game statistics">
                    <div class="stat-item">
                        <div class="stat-value" id="calledCount" aria-label="Numbers called">0</div>
                        <div class="stat-label">Called</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="remainingCount" aria-label="Numbers remaining">75</div>
                        <div class="stat-label">Remaining</div>
                    </div>
                </div>
            </div>

            <div class="board">
                <div class="numbers-grid" id="numbersGrid" role="grid" aria-label="Bingo number board"></div>
            </div>
        </div>

        <div class="history">
            <div class="history-title">Call History (Most Recent First)</div>
            <div class="history-numbers" id="historyNumbers" aria-live="off"></div>
        </div>
    </div>

    <script>
        // ===== TV/Remote Control Compatibility Layer =====
        const TVConfig = {
            isTV: /Android.*TV|SmartTV|HbbTV|CrKey|Netflix|Web0S|Tizen/i.test(navigator.userAgent),
            focusableSelector: 'button, .number-cell[tabindex]:not([tabindex="-1"])',
            navigationKeys: {
                up: ['ArrowUp', 'Up'],
                down: ['ArrowDown', 'Down'], 
                left: ['ArrowLeft', 'Left'],
                right: ['ArrowRight', 'Right'],
                select: ['Enter', ' ', 'OK'],
                back: ['Escape', 'Back', 'BrowserBack']
            }
        };

        // ===== Game State =====
        let availableNumbers = [];
        let calledNumbers = [];
        let autoCallInterval = null;
        let synth = window.speechSynthesis;
        let voicesLoaded = false;
        let audioContext = null;
        let currentFocusedCell = null;

        // ===== Android TV Voice Loading Fix =====
        function loadVoices() {
            return new Promise((resolve) => {
                const load = () => {
                    const voices = synth.getVoices();
                    if (voices && voices.length > 0) {
                        voicesLoaded = true;
                        resolve(voices);
                    }
                };
                
                load();
                if (!voicesLoaded) {
                    synth.onvoiceschanged = load;
                    // Android TV fallback: poll for voices
                    const poll = setInterval(() => {
                        if (synth.getVoices().length > 0) {
                            clearInterval(poll);
                            load();
                        }
                    }, 500);
                    setTimeout(() => clearInterval(poll), 5000);
                }
            });
        }

        // ===== Audio Context Initialization (Android TV Fix) =====
        function initAudioContext() {
            if (!audioContext) {
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.warn('AudioContext not supported:', e);
                }
            }
            // Resume if suspended (Android requirement)
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume().catch(() => {});
            }
        }

        // ===== Sound Functions =====
        function playCallSound() {
            initAudioContext();
            if (!audioContext) return;
            
            try {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.25, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.4);
            } catch (e) {
                console.warn('Sound play failed:', e);
            }
        }

        function speakNumber(number, letter) {
            if (!synth) return;
            
            // Cancel any ongoing speech
            if (synth.speaking) synth.cancel();
            
            // Android TV: small delay ensures audio context is ready
            setTimeout(() => {
                try {
                    const utterance = new SpeechSynthesisUtterance(`${letter} ${number}`);
                    utterance.rate = 0.9;
                    utterance.pitch = 1.0;
                    utterance.volume = 1.0;
                    utterance.lang = 'en-US';
                    
                    const voices = synth.getVoices();
                    if (voices && voices.length > 0) {
                        const englishVoice = voices.find(v => 
                            v.lang && v.lang.startsWith('en') && 
                            !v.name.toLowerCase().includes('female')
                        ) || voices[0];
                        if (englishVoice) utterance.voice = englishVoice;
                    }
                    
                    synth.speak(utterance);
                } catch (error) {
                    console.warn('Speech synthesis error:', error);
                    // Visual fallback: flash the call display
                    const display = document.querySelector('.call-display');
                    display.style.animation = 'pulse 0.3s ease';
                    setTimeout(() => display.style.animation = '', 300);
                }
            }, TVConfig.isTV ? 150 : 50);
        }

        // ===== Visual Helpers =====
        function getRandomColor() {
            const colors = [
                '#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', 
                '#6c5ce7', '#a29bfe', '#fd79a8', '#fdcb6e',
                '#e17055', '#00b894', '#0984e3', '#6c5ce7'
            ];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function animateRollingNumbers(finalNumber) {
            const rollingContainer = document.getElementById('rollingNumbers');
            rollingContainer.classList.add('active');
            rollingContainer.innerHTML = '';

            let iterations = 0;
            const maxIterations = TVConfig.isTV ? 12 : 20; // Fewer iterations for TV performance
            const intervalTime = TVConfig.isTV ? 120 : 100;

            const rollInterval = setInterval(() => {
                const randomNum = Math.floor(Math.random() * 75) + 1;
                const numElement = document.createElement('div');
                numElement.className = 'rolling-number';
                numElement.textContent = randomNum;
                numElement.style.color = getRandomColor();
                
                rollingContainer.innerHTML = '';
                rollingContainer.appendChild(numElement);
                iterations++;

                if (iterations >= maxIterations) {
                    clearInterval(rollInterval);
                    setTimeout(() => {
                        rollingContainer.classList.remove('active');
                        const ballDisplay = document.getElementById('currentBall');
                        ballDisplay.classList.add('animating');
                        setTimeout(() => ballDisplay.classList.remove('animating'), 250);
                    }, 100);
                }
            }, intervalTime);
        }

        // ===== Game Logic =====
        function initializeGame() {
            availableNumbers = Array.from({length: 75}, (_, i) => i + 1);
            calledNumbers = [];
            renderBoard();
            updateStats();
            updateHistory();
            document.getElementById('currentBall').textContent = '-';
            document.getElementById('callLetter').textContent = 'Ready to Start';
            currentFocusedCell = null;
        }

        function renderBoard() {
            const grid = document.getElementById('numbersGrid');
            grid.innerHTML = '';
            
            for (let i = 1; i <= 75; i++) {
                const cell = document.createElement('div');
                cell.className = 'number-cell';
                cell.textContent = i;
                cell.id = `cell-${i}`;
                cell.setAttribute('role', 'gridcell');
                cell.setAttribute('aria-label', `Number ${i}`);
                cell.tabIndex = -1; // Focusable via JS only
                
                if (calledNumbers.includes(i)) {
                    cell.classList.add('called');
                    cell.setAttribute('aria-selected', 'true');
                } else {
                    cell.setAttribute('aria-selected', 'false');
                }
                
                // TV: Add click + keydown handlers
                cell.addEventListener('click', () => toggleNumber(i));
                cell.addEventListener('keydown', (e) => {
                    if (TVConfig.navigationKeys.select.includes(e.key)) {
                        e.preventDefault();
                        toggleNumber(i);
                    }
                });
                
                grid.appendChild(cell);
            }
            
            // Setup initial focus management for TV
            if (TVConfig.isTV) {
                setupGridNavigation();
            }
        }

        // ===== TV Grid Navigation (D-Pad Support) =====
        function setupGridNavigation() {
            const cells = Array.from(document.querySelectorAll('.number-cell'));
            const cols = 12;
            
            cells.forEach((cell, index) => {
                cell.addEventListener('focus', () => {
                    currentFocusedCell = index;
                    cell.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                });
            });
            
            // Handle arrow key navigation on the grid container
            document.getElementById('numbersGrid').addEventListener('keydown', (e) => {
                if (!currentFocusedCell && cells.length > 0) {
                    // Focus first available cell if none focused
                    cells[0].tabIndex = 0;
                    cells[0].focus();
                    currentFocusedCell = 0;
                    e.preventDefault();
                    return;
                }
                
                let newIndex = currentFocusedCell;
                const row = Math.floor(currentFocusedCell / cols);
                const col = currentFocusedCell % cols;
                
                if (TVConfig.navigationKeys.up.includes(e.key)) {
                    newIndex = Math.max(0, currentFocusedCell - cols);
                    e.preventDefault();
                } else if (TVConfig.navigationKeys.down.includes(e.key)) {
                    newIndex = Math.min(cells.length - 1, currentFocusedCell + cols);
                    e.preventDefault();
                } else if (TVConfig.navigationKeys.left.includes(e.key) && col > 0) {
                    newIndex = currentFocusedCell - 1;
                    e.preventDefault();
                } else if (TVConfig.navigationKeys.right.includes(e.key) && col < cols - 1) {
                    newIndex = currentFocusedCell + 1;
                    e.preventDefault();
                }
                
                if (newIndex !== currentFocusedCell && cells[newIndex]) {
                    cells[currentFocusedCell].tabIndex = -1;
                    cells[newIndex].tabIndex = 0;
                    cells[newIndex].focus();
                    currentFocusedCell = newIndex;
                }
            });
        }

        function toggleNumber(number) {
            const cell = document.getElementById(`cell-${number}`);
            if (!cell) return;
            
            if (calledNumbers.includes(number)) {
                calledNumbers = calledNumbers.filter(n => n !== number);
                availableNumbers.push(number);
                availableNumbers.sort((a, b) => a - b);
                cell.classList.remove('called');
                cell.setAttribute('aria-selected', 'false');
            } else {
                calledNumbers.push(number);
                availableNumbers = availableNumbers.filter(n => n !== number);
                cell.classList.add('called');
                cell.setAttribute('aria-selected', 'true');
            }
            updateStats();
            updateHistory();
        }

        function callNumber() {
            if (availableNumbers.length === 0) {
                showAlert('All numbers have been called!');
                return;
            }

            playCallSound();
            const randomIndex = Math.floor(Math.random() * availableNumbers.length);
            const number = availableNumbers[randomIndex];
            
            animateRollingNumbers(number);

            setTimeout(() => {
                availableNumbers.splice(randomIndex, 1);
                calledNumbers.unshift(number);

                const letter = getLetterForNumber(number);
                document.getElementById('currentBall').textContent = number;
                document.getElementById('callLetter').textContent = `${letter} - ${number}`;

                speakNumber(number, letter);

                const cell = document.getElementById(`cell-${number}`);
                if (cell) {
                    cell.classList.add('called');
                    cell.setAttribute('aria-selected', 'true');
                    
                    // Simplified visual feedback for TV
                    if (TVConfig.isTV) {
                        cell.style.transform = 'scale(1.1)';
                        setTimeout(() => cell.style.transform = '', 300);
                    } else {
                        // PC: color blink effect
                        const colors = ['#ef4444', '#f59e0b', '#8b5cf6'];
                        let idx = 0;
                        const blink = setInterval(() => {
                            if (idx < colors.length && cell.classList.contains('called')) {
                                cell.style.backgroundColor = colors[idx++];
                            } else {
                                clearInterval(blink);
                                cell.style.backgroundColor = '';
                            }
                        }, 250);
                    }
                }

                updateStats();
                updateHistory();
            }, TVConfig.isTV ? 1800 : 2100);
        }

        function getLetterForNumber(number) {
            if (number <= 15) return 'B';
            if (number <= 30) return 'I';
            if (number <= 45) return 'N';
            if (number <= 60) return 'G';
            return 'O';
        }

        function updateStats() {
            document.getElementById('calledCount').textContent = calledNumbers.length;
            document.getElementById('remainingCount').textContent = availableNumbers.length;
        }

        function updateHistory() {
            const historyDiv = document.getElementById('historyNumbers');
            historyDiv.innerHTML = '';
            
            calledNumbers.slice(0, 20).forEach(number => {
                const span = document.createElement('span');
                span.className = 'history-number';
                span.textContent = `${getLetterForNumber(number)}${number}`;
                span.setAttribute('aria-label', `Called: ${getLetterForNumber(number)} ${number}`);
                historyDiv.appendChild(span);
            });
        }

        function toggleAuto() {
            const btn = document.getElementById('autoBtn');
            const callBtn = document.getElementById('callBtn');
            
            if (autoCallInterval) {
                clearInterval(autoCallInterval);
                autoCallInterval = null;
                btn.textContent = 'Start Auto-Call';
                callBtn.disabled = false;
                btn.setAttribute('aria-pressed', 'false');
            } else {
                if (availableNumbers.length === 0) {
                    showAlert('All numbers have been called!');
                    return;
                }
                const interval = TVConfig.isTV ? 7000 : 5000; // Slower for TV
                autoCallInterval = setInterval(() => {
                    if (availableNumbers.length > 0) {
                        callNumber();
                    } else {
                        toggleAuto();
                        showAlert('All numbers have been called!');
                    }
                }, interval);
                btn.textContent = 'Stop Auto-Call';
                callBtn.disabled = true;
                btn.setAttribute('aria-pressed', 'true');
            }
        }

        function resetGame() {
            if (autoCallInterval) toggleAuto();
            if (confirm('Reset the bingo game?')) {
                initializeGame();
            }
        }

        function showAlert(message) {
            // TV-friendly alert (no browser dialog)
            const display = document.querySelector('.call-display');
            const originalText = document.getElementById('callLetter').textContent;
            
            document.getElementById('callLetter').textContent = `⚠️ ${message}`;
            display.style.background = 'linear-gradient(135deg, #ef4444, #dc2626)';
            
            setTimeout(() => {
                document.getElementById('callLetter').textContent = originalText;
                display.style.background = '';
            }, 2500);
        }

        // ===== Fullscreen with TV Compatibility =====
        function toggleFullscreen() {
            const btn = document.getElementById('fullscreenBtn');
            const docEl = document.documentElement;
            
            const requestFS = docEl.requestFullscreen || 
                           docEl.webkitRequestFullscreen || 
                           docEl.mozRequestFullScreen || 
                           docEl.msRequestFullscreen;
                           
            const exitFS = document.exitFullscreen || 
                          document.webkitExitFullscreen || 
                          document.mozCancelFullScreen || 
                          document.msExitFullscreen;
            
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (requestFS) {
                    requestFS.call(docEl).catch(err => {
                        console.warn('Fullscreen error:', err);
                        // Fallback: maximize via CSS
                        document.body.style.padding = '0';
                        document.querySelector('.container').style.cssText = 
                            'width:100vw;height:100vh;border-radius:0;margin:0;padding:2vw';
                        btn.textContent = 'Exit Fullscreen';
                    });
                }
            } else {
                if (exitFS) {
                    exitFS.call(document).catch(() => {});
                }
                // Reset CSS fallback
                document.body.style.padding = '';
                document.querySelector('.container').style.cssText = '';
                btn.textContent = 'Enter Fullscreen';
            }
        }

        // Update fullscreen button text
        function updateFullscreenButton() {
            const btn = document.getElementById('fullscreenBtn');
            const isFS = document.fullscreenElement || document.webkitFullscreenElement;
            btn.textContent = isFS ? 'Exit Fullscreen' : 'Enter Fullscreen';
            btn.setAttribute('aria-pressed', isFS ? 'true' : 'false');
        }

        document.addEventListener('fullscreenchange', updateFullscreenButton);
        document.addEventListener('webkitfullscreenchange', updateFullscreenButton);

        // ===== Remote Control Keyboard Handler =====
        document.addEventListener('keydown', (e) => {
            // Prevent default scrolling for arrow keys on TV
            if (TVConfig.isTV && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
                // Only prevent if not typing in an input
                if (e.target === document.body || e.target === document.documentElement) {
                    e.preventDefault();
                }
            }
            
            // Fullscreen shortcuts
            if (e.key === 'f' || e.key === 'F' || e.keyCode === 122) {
                e.preventDefault();
                toggleFullscreen();
                return;
            }
            
            // ESC/Back to exit fullscreen
            if ((e.key === 'Escape' || e.key === 'Back') && 
                (document.fullscreenElement || document.webkitFullscreenElement)) {
                e.preventDefault();
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                return;
            }
            
            // Global shortcuts when no element is focused
            if (document.activeElement === document.body || 
                document.activeElement === document.documentElement) {
                
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    callNumber();
                } else if (e.key === 'r' || e.key === 'R') {
                    e.preventDefault();
                    resetGame();
                } else if (e.key === 'a' || e.key === 'A') {
                    e.preventDefault();
                    toggleAuto();
                }
            }
        }, { passive: false });

        // ===== Initialization =====
        window.addEventListener('load', async () => {
            // Pre-load voices for Android TV
            await loadVoices();
            
            // Initialize game
            initializeGame();
            
            // TV: Set initial focus to first button for remote navigation
            if (TVConfig.isTV) {
                const firstBtn = document.querySelector('.controls button');
                if (firstBtn) {
                    firstBtn.tabIndex = 0;
                    setTimeout(() => firstBtn.focus(), 500);
                }
                // Add TV mode indicator (optional, can be removed)
                console.log('📺 TV Mode detected - optimized for remote control');
            }
            
            // Update fullscreen button state
            updateFullscreenButton();
        });

        // Unlock audio/speech on first interaction (Android requirement)
        document.addEventListener('pointerdown', () => {
            initAudioContext();
            if (!voicesLoaded) loadVoices();
            // Silent utterance to unlock speech on Android
            if (synth && !synth.speaking) {
                try {
                    const u = new SpeechSynthesisUtterance('');
                    u.volume = 0;
                    synth.speak(u);
                } catch(e) {}
            }
        }, { once: true });

        // Handle visibility change (TV apps may pause/resume)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && autoCallInterval) {
                // Pause auto-call when app is backgrounded
                clearInterval(autoCallInterval);
                autoCallInterval = null;
                const btn = document.getElementById('autoBtn');
                btn.textContent = 'Start Auto-Call';
                document.getElementById('callBtn').disabled = false;
            }
        });
    </script>
</body>
</html>
