<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan Me — Woodlands Zone 6</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: radial-gradient(ellipse at top, #1e3a8a 0%, #0f172a 60%, #020617 100%);
    color: white;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100vh; padding: 2vmin;
    text-align: center; gap: 3vmin;
  }
  .title {
    font-size: 5vmin; font-weight: 800;
    letter-spacing: 0.2vmin; color: #ffffff;
    text-shadow: 0 0 30px rgba(96, 165, 250, 0.5);
  }
  .qr-card {
    background: white;
    padding: 3vmin;
    border-radius: 3vmin;
    box-shadow:
      0 0 0 0.4vmin rgba(96, 165, 250, 0.6),
      0 30px 80px rgba(0, 0, 0, 0.6),
      0 0 100px rgba(96, 165, 250, 0.3);
    animation: softPulse 3s ease-in-out infinite;
  }
  .qr-card img {
    display: block;
    width: 55vmin; height: 55vmin;
    image-rendering: pixelated;
  }
  .instructions {
    font-size: 2.2vmin;
    line-height: 1.8;
    color: #cbd5e1;
    max-width: 80vw;
    font-weight: 500;
  }
  .instructions strong { color: #60a5fa; font-weight: 700; }
  .clock {
    position: fixed; top: 2vh; right: 3vw;
    font-size: 2.5vmin; color: #64748b;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.1vmin;
  }
  .footer-brand {
    position: fixed; bottom: 2vh; left: 0; right: 0;
    text-align: center;
    font-size: 1.6vmin; color: #475569;
    letter-spacing: 0.5vmin; font-weight: 600;
    text-transform: uppercase;
  }
  @keyframes softPulse {
    0%, 100% {
      box-shadow:
        0 0 0 0.4vmin rgba(96, 165, 250, 0.6),
        0 30px 80px rgba(0, 0, 0, 0.6),
        0 0 100px rgba(96, 165, 250, 0.3);
    }
    50% {
      box-shadow:
        0 0 0 0.6vmin rgba(96, 165, 250, 0.9),
        0 30px 80px rgba(0, 0, 0, 0.6),
        0 0 150px rgba(96, 165, 250, 0.5);
    }
  }
  @media (orientation: portrait) {
    .qr-card img { width: 80vmin; height: 80vmin; }
    .title { font-size: 7vmin; }
    .instructions { font-size: 3.5vmin; }
    .clock { font-size: 3.5vmin; }
  }
</style>
</head>
<body>
  <div class="clock" id="clock">--:--</div>

  <div class="container">
    <div class="title" id="title">📱 Scan to Get Your QR Code</div>

    <div class="qr-card">
      <img id="qr" alt="QR Code" />
    </div>

    <div class="instructions" id="instructions">
      <strong>1.</strong> Open your phone camera 📷<br>
      <strong>2.</strong> Point it at the QR code<br>
      <strong>3.</strong> Tap the link that pops up<br>
      <strong>4.</strong> Enter your 8-digit phone number
    </div>
  </div>

  <div class="footer-brand">Woodlands Zone 6 Community Hub</div>

<script>
  // ═══════════════════════════════════════════════════════════
  //  ⚙️  CONFIGURATION — edit these lines to customize
  // ═══════════════════════════════════════════════════════════
  const DEFAULT_URL   = "https://woodlands-community-hub.onrender.com/resident_qr";
  const DEFAULT_TITLE = "📱 Scan to Get Your QR Code";
  const DEFAULT_INSTRUCTIONS = `
    <strong>1.</strong> Open your phone camera 📷<br>
    <strong>2.</strong> Point it at the QR code<br>
    <strong>3.</strong> Tap the link that pops up<br>
    <strong>4.</strong> Enter your 8-digit phone number
  `;
  const AUTO_RELOAD_HOURS = 6;   // 0 = disable
  // ═══════════════════════════════════════════════════════════

  const params = new URLSearchParams(window.location.search);
  const targetUrl       = params.get("url")   || DEFAULT_URL;
  const titleText       = params.get("title") || DEFAULT_TITLE;
  const instructionsHtml= params.get("instructions") || DEFAULT_INSTRUCTIONS;

  const qrImg = document.getElementById("qr");
  const qrApi = `https://api.qrserver.com/v1/create-qr-code/?size=1000x1000&margin=10&ecc=M&data=${encodeURIComponent(targetUrl)}`;
  qrImg.src = qrApi;
  qrImg.onerror = function () {
    qrImg.src = `https://quickchart.io/qr?size=1000&margin=1&text=${encodeURIComponent(targetUrl)}`;
  };

  document.getElementById("title").textContent = titleText;
  document.getElementById("instructions").innerHTML = instructionsHtml;
  document.title = "Scan Me — " + titleText;

  function updateClock() {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, "0");
    const mm = String(now.getMinutes()).padStart(2, "0");
    document.getElementById("clock").textContent = `${hh}:${mm}`;
  }
  updateClock();
  setInterval(updateClock, 30000);

  if (AUTO_RELOAD_HOURS > 0) {
    setTimeout(() => window.location.reload(), AUTO_RELOAD_HOURS * 60 * 60 * 1000);
  }
</script>
</body>
</html>
